env: "local" # local, dev, prod

swagger:
  enabled: false

http_server:
  address: ":8080"
  timeout: 4s
  idle_timeout: 30s
  handlers_timeout: 5s

clickhouse:
  addr: clickhouse:9363
  database: voting
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h
  dial_timeout: 5s
  batch_size: 2000
  flush_interval: 1s
