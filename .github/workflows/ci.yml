name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, voting_service, notification_service]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Vet
        working-directory: ./${{ matrix.service }}
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ./${{ matrix.service }}
          version: v2.12.2

      - name: Test
        working-directory: ./${{ matrix.service }}
        run: go test -race -cover ./...

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create dummy env files for config validation
        run: |
          echo "POSTGRES_USER=ci" >> .env
          echo "POSTGRES_PASSWORD=ci" >> .env
          echo "POSTGRES_DB=ci" >> .env
          echo "PLACEHOLDER=ci" > ./auth_service/.env
          echo "PLACEHOLDER=ci" > ./notification_service/.env
          echo "PLACEHOLDER=ci" > ./monitoring/.env

      - name: Validate docker compose config
        run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        service: [auth_service, voting_service, notification_service]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.service }} image
        run: docker build -f ./${{ matrix.service }}/docker/Dockerfile -t ${{ matrix.service }}:ci ./${{ matrix.service }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
