version: '3'

dotenv: ['./auth_service/.env']

vars:
  DSN: postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@postgres:5432/{{.POSTGRES_DB}}?sslmode=disable

tasks:
  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres up

  migrate:up-by-one:
    desc: Apply next single pending migration
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres up-by-one

  migrate:down:
    desc: Rollback last applied migration
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres down

  migrate:status:
    desc: Show migration status
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres status

  migrate:validate:
    desc: Validate migration files without applying
    cmds:
      - docker compose run --rm migrator validate

  migrate:create:
    desc: Create new SQL migration (task migrate:create -- name=add_users_table)
    requires:
      vars: [name]
    cmds:
      - docker compose run --rm migrator create {{.name}} sql

  migrate:reset:
    desc: Rollback ALL migrations — destructive
    prompt: "This will drop all schema objects. Continue?"
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres reset

  migrate:redo:
    desc: Rollback and re-apply last migration
    cmds:
      - docker compose run --rm -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" migrator postgres redo
